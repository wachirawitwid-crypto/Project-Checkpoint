<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ball"></div>
    <div class="ball2"></div>
    <div class="ball3"></div>
    <div class="card">
        <div class="card-body">
            <span class="icon_title">CS100 TEAM PROJECT</span>
            <h1>Power Up! Portfolio</h1>
            <div class="bar">
                <!-- สเต็ปที่ 1 -->
                <div class="step-item">
                    <a id="bar_1" class="activate" href="#">1</a>
                    <p class="step-text">Basic Details</p>
                </div>

                <!-- สเต็ปที่ 2 -->
                <div class="step-item">
                    <a id="bar_2" class="not_activate" href="#">2</a>
                    <p class="step-text">Add Works / Items</p>
                </div>

                <!-- สเต็ปที่ 3 -->
                <div class="step-item">
                    <a id="bar_3" class="not_activate" href="#">3</a>
                    <p class="step-text">Portfolio Showcase</p>
                </div>
            </div>
            <div class="title">
                <h3><ion-icon name="bookmarks" style="color: rgb(242, 132, 59);"></ion-icon></ion-icon> Add Portfolio
                    Item</h3>
                <p id="required" style="color: rgba(128, 128, 128, 0.47);">* Required for CS100 Portfolio</p>
            </div>

            <div class="input_box">
                <div class="name">
                    <div class="full_name">
                        <label for="">FULL NAME / DISPLAY NAME *</label><br>
                        <input class="input_text" type="text" placeholder="e.g Aliex Rivera or Somchai Jaidee"
                            style="height: 30px; color: rgb(155, 155, 155);margin-top: 10px;">
                    </div>
                    <div class="Id">
                        <label>PORTFOLIO ID TAG</label><br>
                        <input class="input_text" type="text" placeholder="portfolio_1"
                            style="height: 20px;color: rgb(155, 155, 155); margin-top: 10px;">
                    </div>
                </div>

                <div class="input_box">
                    <label for="">WHAT I ENJOY (ชอบทำอะไร)</label>
                    <textarea class="input_text" type="text" placeholder="Building web apps, solving algorithmic puzzles, playing games"></textarea>
                </div>

                <div class="input_box">
                    <label for="">WHAT I'VE TRIED (ลองทำอะไรมาแล้วบ้าง) *</label>
                    <textarea class="input_text" type="text" style="height: 150px;" placeholder="HTML5, CSS3, JavaScript ES6, Git Basics"></textarea>
                </div>
                <div class="input_box">
                    <label for="">WHAT I'M CURIOUS ABOUT (สนใจหรืออยากรู้อะไรเพิ่ม) *</label>
                    <textarea class="input_text" type="text" style="height: 80px;" placeholder="React.js, Node.js, Cloud Computing with AWS"></textarea>
                </div>
            </div>
            <div class="parent-box">
                <button id="submit" href="" onclick="updateStep(2)">Save Profile & Continue</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
